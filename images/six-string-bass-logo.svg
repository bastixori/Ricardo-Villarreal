<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-label="Logo Ricardo Villarreal Muñoz - Bajo de 6 cuerdas">
  <defs>
    <!-- Gradiente dorado de lujo -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc5" />
      <stop offset="35%" stop-color="#e2ba72" />
      <stop offset="70%" stop-color="#c6923b" />
      <stop offset="100%" stop-color="#8c5f18" />
    </linearGradient>

    <!-- Gradiente oscuro de fondo -->
    <radialGradient id="darkBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f1a14" />
      <stop offset="70%" stop-color="#0f0e0c" />
      <stop offset="100%" stop-color="#070605" />
    </radialGradient>

    <!-- Brillo dorado sutil -->
    <linearGradient id="metalString" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffd88a" />
      <stop offset="75%" stop-color="#d4a359" />
      <stop offset="100%" stop-color="#916522" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor / Insignia Premium -->
  <rect x="3" y="3" width="114" height="114" rx="26" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <rect x="7" y="7" width="106" height="106" rx="22" fill="none" stroke="#d4a359" stroke-width="0.75" stroke-opacity="0.35" />

  <!-- Silueta estilizada del cuerpo del bajo de 6 cuerdas (parte inferior) -->
  <path d="M 32 94 C 28 84 32 75 40 73 C 44 72 45 68 45 64 L 75 64 C 75 68 76 72 80 73 C 88 75 92 84 88 94 C 84 105 36 105 32 94 Z" 
        fill="#1a1510" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85" />

  <!-- Pastilla Soapbar con 6 polos para 6 cuerdas -->
  <rect x="44" y="72" width="32" height="7" rx="2" fill="#120e0a" stroke="#c6923b" stroke-width="0.8" />
  <circle cx="47" cy="75.5" r="1.1" fill="url(#goldGrad)" />
  <circle cx="52.2" cy="75.5" r="1.1" fill="url(#goldGrad)" />
  <circle cx="57.4" cy="75.5" r="1.1" fill="url(#goldGrad)" />
  <circle cx="62.6" cy="75.5" r="1.1" fill="url(#goldGrad)" />
  <circle cx="67.8" cy="75.5" r="1.1" fill="url(#goldGrad)" />
  <circle cx="73" cy="75.5" r="1.1" fill="url(#goldGrad)" />

  <!-- Puente masivo de 6 cuerdas con 6 selletas -->
  <rect x="45" y="85" width="30" height="9" rx="1.5" fill="url(#goldGrad)" />
  <line x1="47.5" y1="85" x2="47.5" y2="92" stroke="#4a320c" stroke-width="1" />
  <line x1="52.5" y1="85" x2="52.5" y2="92" stroke="#4a320c" stroke-width="1" />
  <line x1="57.5" y1="85" x2="57.5" y2="92" stroke="#4a320c" stroke-width="1" />
  <line x1="62.5" y1="85" x2="62.5" y2="92" stroke="#4a320c" stroke-width="1" />
  <line x1="67.5" y1="85" x2="67.5" y2="92" stroke="#4a320c" stroke-width="1" />
  <line x1="72.5" y1="85" x2="72.5" y2="92" stroke="#4a320c" stroke-width="1" />

  <!-- Mástil ancho para 6 cuerdas (característico de bajo de 6 cuerdas) -->
  <path d="M 46 64 L 48 30 L 72 30 L 74 64 Z" fill="#241a10" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Trastes -->
  <line x1="47.7" y1="36" x2="72.3" y2="36" stroke="#c6923b" stroke-width="0.7" opacity="0.7" />
  <line x1="47.3" y1="43" x2="72.7" y2="43" stroke="#c6923b" stroke-width="0.7" opacity="0.7" />
  <line x1="46.9" y1="50" x2="73.1" y2="50" stroke="#c6923b" stroke-width="0.7" opacity="0.7" />
  <line x1="46.5" y1="57" x2="73.5" y2="57" stroke="#c6923b" stroke-width="0.7" opacity="0.7" />

  <!-- Incrustaciones / Marcadores de nácar en trastes 3 y 5 -->
  <circle cx="60" cy="39.5" r="1.3" fill="#faecc5" opacity="0.8" />
  <circle cx="60" cy="53.5" r="1.3" fill="#faecc5" opacity="0.8" />

  <!-- Clavijero / Headstock de 6 cuerdas (3 a la izquierda, 3 a la derecha) -->
  <path d="M 48 30 C 47 26 44 24 43 18 C 42 13 54 11 60 14 C 66 11 78 13 77 18 C 76 24 73 26 72 30 Z" 
        fill="#1a1209" stroke="url(#goldGrad)" stroke-width="1.3" />

  <!-- 6 Clavijas / Tuning Pegs (3 a la izquierda + 3 a la derecha = 6 CUERDAS) -->
  <!-- Lado izquierdo (Cuerdas graves: B, E, A) -->
  <!-- Clavija 1 (B) -->
  <circle cx="41" cy="26" r="2.2" fill="url(#goldGrad)" />
  <line x1="41" y1="26" x2="34" y2="26" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="33" cy="26" rx="2.2" ry="3.8" fill="url(#goldGrad)" />

  <!-- Clavija 2 (E) -->
  <circle cx="42" cy="20" r="2.2" fill="url(#goldGrad)" />
  <line x1="42" y1="20" x2="35" y2="20" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="34" cy="20" rx="2.2" ry="3.8" fill="url(#goldGrad)" />

  <!-- Clavija 3 (A) -->
  <circle cx="44" cy="14" r="2.2" fill="url(#goldGrad)" />
  <line x1="44" y1="14" x2="37" y2="14" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="36" cy="14" rx="2.2" ry="3.8" fill="url(#goldGrad)" />

  <!-- Lado derecho (Cuerdas agudas: D, G, C) -->
  <!-- Clavija 4 (D) -->
  <circle cx="76" cy="14" r="2.2" fill="url(#goldGrad)" />
  <line x1="76" y1="14" x2="83" y2="14" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="84" cy="14" rx="2.2" ry="3.8" fill="url(#goldGrad)" />

  <!-- Clavija 5 (G) -->
  <circle cx="78" cy="20" r="2.2" fill="url(#goldGrad)" />
  <line x1="78" y1="20" x2="85" y2="20" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="86" cy="20" rx="2.2" ry="3.8" fill="url(#goldGrad)" />

  <!-- Clavija 6 (C) -->
  <circle cx="79" cy="26" r="2.2" fill="url(#goldGrad)" />
  <line x1="79" y1="26" x2="86" y2="26" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="87" cy="26" rx="2.2" ry="3.8" fill="url(#goldGrad)" />

  <!-- Cejuela / Nut superior -->
  <rect x="47.8" y="29.2" width="24.4" height="2" rx="0.5" fill="#f5e8c4" />

  <!-- ========================================================
       LAS 6 CUERDAS (Grosor calibrado de 6 cuerdas: B - E - A - D - G - C)
       ======================================================== -->
  <!-- Cuerda 1: Si grave / Low B (la más gruesa, 2.0px) -->
  <line x1="41" y1="26" x2="49.5" y2="30" stroke="url(#metalString)" stroke-width="1.5" opacity="0.9" />
  <line x1="49.5" y1="30" x2="47.5" y2="85" stroke="url(#metalString)" stroke-width="2.1" filter="url(#goldGlow)" />

  <!-- Cuerda 2: Mi / E (1.7px) -->
  <line x1="42" y1="20" x2="53.8" y2="30" stroke="url(#metalString)" stroke-width="1.3" opacity="0.9" />
  <line x1="53.8" y1="30" x2="52.5" y2="85" stroke="url(#metalString)" stroke-width="1.7" />

  <!-- Cuerda 3: La / A (1.4px) -->
  <line x1="44" y1="14" x2="58" y2="30" stroke="url(#metalString)" stroke-width="1.1" opacity="0.9" />
  <line x1="58" y1="30" x2="57.5" y2="85" stroke="url(#metalString)" stroke-width="1.4" />

  <!-- Cuerda 4: Re / D (1.1px) -->
  <line x1="76" y1="14" x2="62" y2="30" stroke="url(#metalString)" stroke-width="0.9" opacity="0.9" />
  <line x1="62" y1="30" x2="62.5" y2="85" stroke="url(#metalString)" stroke-width="1.1" />

  <!-- Cuerda 5: Sol / G (0.9px) -->
  <line x1="78" y1="20" x2="66.2" y2="30" stroke="url(#metalString)" stroke-width="0.8" opacity="0.9" />
  <line x1="66.2" y1="30" x2="67.5" y2="85" stroke="url(#metalString)" stroke-width="0.9" />

  <!-- Cuerda 6: Do agudo / High C (0.7px) -->
  <line x1="79" y1="26" x2="70.5" y2="30" stroke="url(#metalString)" stroke-width="0.7" opacity="0.9" />
  <line x1="70.5" y1="30" x2="72.5" y2="85" stroke="url(#metalString)" stroke-width="0.7" />

  <!-- Insignia distintiva inferior: "6 STRINGS BASS" -->
  <g transform="translate(60, 107)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.2" font-weight="700" letter-spacing="1.5" fill="url(#goldGrad)">6 STRINGS BASS</text>
  </g>
</svg>